<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gomoku · 五子棋</title>
<style>
  :root {
    --bg: #f3ede2; --panel: #fffaf2; --text: #2b2520; --muted: #8c8173; --line: #e2d8c8;
    --wood: #e4bf82; --wood-dark: #c99a55; --grid: #5a4127; --accent: #b5452f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1916; --panel: #27231f; --text: #efe8dd; --muted: #a39887; --line: #3a342d; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  }
  header { width: min(100%, 620px); display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 14px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: 2px; }
  .lang { padding: 4px 12px; font-size: 13px; border-radius: 999px; }
  h1 small { font-weight: 400; color: var(--muted); font-size: 14px; letter-spacing: 0; margin-left: 6px; }

  .modes { width: min(100%, 620px); display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 14px; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
  .seg button { border: 0; padding: 5px 16px; font-size: 13px; border-radius: 999px; background: transparent; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .seg button:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .player input[readonly] { cursor: default; }
  .online { width: min(100%, 620px); margin-bottom: 14px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; gap: 10px; }
  .online .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .online .row > * { min-width: 0; }
  .online input { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); width: 9.5em; text-transform: uppercase; letter-spacing: 2px; }
  .online .muted { color: var(--muted); font-size: 13px; }
  .online .link { flex: 1 1 240px; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 7px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; white-space: nowrap; user-select: all; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #c9a227; margin-right: 6px; vertical-align: 1px; }
  .dot.on { background: #3f9a5b; }
  .online .err { color: var(--accent); font-size: 13px; }
  .players { display: flex; gap: 12px; width: min(100%, 620px); margin-bottom: 14px; }
  .player {
    flex: 1; display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px; transition: border-color .2s, transform .2s;
  }
  .player.active { border-color: var(--accent); transform: translateY(-2px); }
  .player .stone { width: 26px; height: 26px; border-radius: 50%; flex: none; }
  .player input {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text);
    font: inherit; font-weight: 600; outline: none; padding: 2px 0; border-bottom: 1px dashed transparent;
  }
  .player input:focus { border-bottom-color: var(--muted); }
  .player .score { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stone.black { background: radial-gradient(circle at 35% 30%, #666, #111 60%); box-shadow: 0 2px 3px rgba(0,0,0,.4); }
  .stone.white { background: radial-gradient(circle at 35% 30%, #fff, #d9d4cc 70%); box-shadow: 0 2px 3px rgba(0,0,0,.3); }

  .status { height: 26px; margin-bottom: 10px; font-weight: 600; color: var(--muted); text-align: center; }
  .status.win { color: var(--accent); font-size: 17px; }

  .board-wrap {
    width: min(100%, 620px); aspect-ratio: 1; padding: 3.2%;
    background: linear-gradient(135deg, var(--wood), var(--wood-dark));
    border-radius: 12px; box-shadow: 0 10px 30px rgba(60, 35, 10, .25), inset 0 0 0 1px rgba(0,0,0,.08);
    position: relative; touch-action: manipulation;
  }
  canvas { width: 100%; height: 100%; display: block; cursor: pointer; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
  button {
    font: inherit; padding: 8px 18px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .info { margin-top: 14px; color: var(--muted); font-size: 13px; text-align: center; max-width: 520px; }

  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(30, 20, 10, .35); border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .card {
    background: var(--panel); padding: 22px 28px; border-radius: 16px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.25); transform: scale(.9); transition: transform .3s;
  }
  .overlay.show .card { transform: scale(1); }
  .card .big { font-size: 22px; font-weight: 700; margin: 8px 0 4px; }
  .card .stone { width: 40px; height: 40px; border-radius: 50%; margin: 0 auto; }
  .card p { color: var(--muted); margin: 0 0 14px; }
</style>
</head>
<body>
  <header>
    <h1><span data-i18n="title"></span><small data-i18n="subtitle"></small></h1>
    <button class="lang" id="lang" aria-label="Switch language / 切换语言"></button>
  </header>

  <div class="modes">
    <div class="seg" id="modeSeg" role="group">
      <button data-mode="1p" data-i18n="onePlayer"></button>
      <button data-mode="2p" data-i18n="twoPlayers"></button>
      <button data-mode="online" data-i18n="online"></button>
    </div>
    <div class="seg" id="diffSeg" role="group">
      <button data-diff="easy" data-i18n="easy"></button>
      <button data-diff="medium" data-i18n="medium"></button>
      <button data-diff="hard" data-i18n="hard"></button>
    </div>
  </div>

  <div class="online" id="onlinePanel" hidden>
    <div id="lobby">
      <div class="row">
        <button class="primary" id="createRoom" data-i18n="createRoom"></button>
        <span class="muted" data-i18n="or"></span>
        <input id="joinCode" maxlength="6" autocomplete="off" spellcheck="false">
        <button id="joinRoom" data-i18n="joinRoom"></button>
      </div>
      <div class="muted" data-i18n="lobbyHint" style="margin-top:8px"></div>
    </div>
    <div id="inRoom" hidden>
      <div class="row"><span><span class="dot" id="peerDot"></span><span id="roomLine"></span></span></div>
      <div class="row">
        <div class="link" id="shareLink"></div>
        <button id="copyLink" data-i18n="copy"></button>
        <button id="leaveRoom" data-i18n="leave"></button>
      </div>
    </div>
    <div class="err" id="onlineErr" hidden></div>
  </div>

  <div class="players">
    <div class="player" id="p1">
      <div class="stone black"></div>
      <input id="name1" maxlength="10">
      <div class="score" id="score1">0</div>
    </div>
    <div class="player" id="p2">
      <div class="stone white"></div>
      <input id="name2" maxlength="10">
      <div class="score" id="score2">0</div>
    </div>
  </div>

  <div class="status" id="status"></div>

  <div class="board-wrap">
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay">
      <div class="card">
        <div class="stone" id="winStone"></div>
        <div class="big" id="winText"></div>
        <p id="winSub"></p>
        <button class="primary" id="again" data-i18n="again"></button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="undo" data-i18n="undo"></button>
    <button id="restart" data-i18n="restart"></button>
    <button id="resetScore" data-i18n="resetScore"></button>
  </div>
  <div class="info" id="info"></div>

<script>
const N = 15;                       // 15 × 15 路棋盘
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const $ = (id) => document.getElementById(id);

const I18N = {
  en: {
    title: "Gomoku", subtitle: "Five in a Row", black: "Black", white: "White", you: "You", bot: "Bot",
    onePlayer: "1 Player", twoPlayers: "2 Players", easy: "Easy", medium: "Medium", hard: "Hard",
    undo: "Undo", restart: "Restart", resetScore: "Reset score", again: "Play again", toggle: "中文",
    info2: "Take turns placing stones on the intersections. The first to get five in a row horizontally, vertically or diagonally wins. The loser moves first next game. Click a name to edit it.",
    info1: "You play black against the bot. Get five in a row horizontally, vertically or diagonally to win. The loser moves first next game. Undo takes back your last move and the bot's reply.",
    nameLabel: (n) => `${n} player name`,
    turn: (n, k) => `${n} to move · move ${k}`,
    yourTurn: (k) => `Your move · move ${k}`, botTurn: "Bot is thinking…",
    wins: (n) => `${n} wins!`, youWin: "You win!", botWin: "Bot wins!",
    winSub: (k, a, b, f) => `${k} moves · score ${a} : ${b} · ${f} moves first next game`,
    winSubBot: (k, a, b, youFirst) => `${k} moves · score ${a} : ${b} · ${youFirst ? "you move" : "the bot moves"} first next game`,
    draw: "Draw", drawSub: "The board is full. Nobody wins.",
    online: "Online", createRoom: "Create a room", or: "or", joinRoom: "Join", codePh: "Room code",
    lobbyHint: "Create a room and send the link to a friend on another computer. You play black, they play white.",
    roomLine: (code, color, st) => `Room ${code} · you are ${color} · ${st === "on" ? "friend connected" : st === "find" ? "connecting…" : "waiting for your friend to open the link"}`,
    copy: "Copy link", copied: "Copied", leave: "Leave", friend: "Friend", blackWord: "black", whiteWord: "white",
    waitFriend: "Waiting for your friend to join", theirTurn: (n, k) => `Waiting for ${n} · move ${k}`,
    winSubOnline: (k, a, b, f) => `${k} moves · score ${a} : ${b} · ${f} moves first next game`,
    info3: "Each player uses their own device. The room creator plays black, the friend who opens the link plays white. Undo is off in online games.",
    badCode: "Enter the 6-character room code your friend sent you.",
    connectErr: "Couldn't reach the connection server. Check your internet connection and try again.",
  },
  zh: {
    title: "五子棋", subtitle: "Gomoku", black: "黑方", white: "白方", you: "你", bot: "电脑",
    onePlayer: "单人", twoPlayers: "双人", easy: "简单", medium: "中等", hard: "困难",
    undo: "悔棋", restart: "重新开始", resetScore: "清空比分", again: "再来一局", toggle: "EN",
    info2: "两人轮流在交叉点落子，先在横、竖或斜线上连成五子者获胜。每局结束后由输的一方先手。点击名字可以修改。",
    info1: "你执黑与电脑对弈，先在横、竖或斜线上连成五子者获胜。每局结束后由输的一方先手。悔棋会同时撤回你和电脑的上一步。",
    nameLabel: (n) => `${n}名字`,
    turn: (n, k) => `轮到 ${n} 落子 · 第 ${k} 手`,
    yourTurn: (k) => `轮到你落子 · 第 ${k} 手`, botTurn: "电脑思考中…",
    wins: (n) => `${n} 获胜！`, youWin: "你赢了！", botWin: "电脑获胜！",
    winSub: (k, a, b, f) => `共 ${k} 手 · 比分 ${a} : ${b} · 下局 ${f} 先手`,
    winSubBot: (k, a, b, youFirst) => `共 ${k} 手 · 比分 ${a} : ${b} · 下局${youFirst ? "你" : "电脑"}先手`,
    draw: "平局", drawSub: "棋盘下满了，不分胜负",
    online: "联机", createRoom: "创建房间", or: "或", joinRoom: "加入", codePh: "房间号",
    lobbyHint: "创建房间后把链接发给另一台电脑上的朋友。你执黑，朋友执白。",
    roomLine: (code, color, st) => `房间 ${code} · 你执${color} · ${st === "on" ? "朋友已连接" : st === "find" ? "正在连接…" : "等待朋友打开链接"}`,
    copy: "复制链接", copied: "已复制", leave: "离开", friend: "朋友", blackWord: "黑", whiteWord: "白",
    waitFriend: "等待朋友加入", theirTurn: (n, k) => `等待 ${n} 落子 · 第 ${k} 手`,
    winSubOnline: (k, a, b, f) => `共 ${k} 手 · 比分 ${a} : ${b} · 下局 ${f} 先手`,
    info3: "两人各用自己的设备。创建房间的人执黑，打开链接的朋友执白。联机对局不能悔棋。",
    badCode: "请输入朋友发给你的 6 位房间号。",
    connectErr: "连不上联机服务器，请检查网络后再试。",
  },
};

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

let lang = load("gomoku-lang", "en"); if (!I18N[lang]) lang = "en";
let mode = load("gomoku-mode", "2p"); if (!["1p", "2p", "online"].includes(mode)) mode = "2p";
let diff = load("gomoku-diff", "medium"); if (!["easy", "medium", "hard"].includes(diff)) diff = "medium";
let t = I18N[lang];
const vsBot = () => mode === "1p";
const isOnline = () => mode === "online";
const scoresKey = () => isOnline() ? "gomoku-scores-online-" + (net.room || "") : vsBot() ? "gomoku-scores-bot-" + diff : "gomoku-scores";

// 联机：通过公共 MQTT 服务器（加密 WebSocket）中转。房主执黑，朋友执白
const MQTT_JS = "https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js";
const BROKERS = ["wss://broker.hivemq.com:8884/mqtt", "wss://broker.emqx.io:8084/mqtt"];
const topicFor = (code) => "gomoku-eh8/room/" + code;
const net = { room: null, color: 0, client: null, id: "", peerId: null, lastSeen: 0, beat: null, status: "", game: 0, peerName: "", myName: "" };
net.myName = load("gomoku-online-name", "");

// 默认名字（任何语言里的 黑方/白方/你/电脑）不存，切语言时跟着换
const DEFAULTS = new Set(Object.values(I18N).flatMap((d) => [d.black, d.white, d.you, d.bot, d.friend]));
const isDefaultName = (v) => !v.trim() || DEFAULTS.has(v.trim());

let board, moves, current, winner, winLine, hover, first = 1, botTimer = null;
let scores = load(scoresKey(), { 1: 0, 2: 0 });
const names = load("gomoku-names", { 1: "", 2: "" });
for (const i of [1, 2]) if (isDefaultName(names[i] || "")) names[i] = "";

function defaultName(who) {
  if (isOnline()) return who === net.color ? t.you : net.color ? t.friend : (who === 1 ? t.black : t.white);
  return vsBot() ? (who === 1 ? t.you : t.bot) : (who === 1 ? t.black : t.white);
}
function name(who) {
  if (isOnline()) return who === net.color ? (net.myName || t.you) : (net.peerName || defaultName(who));
  if (vsBot() && who === 2) return t.bot;
  return names[who] || defaultName(who);
}
function nameEditable(who) { return isOnline() ? !!net.room && who === net.color : !(vsBot() && who === 2); }
const peerOn = () => net.status === "on";

function renderChrome() {
  t = I18N[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t[el.dataset.i18n]; });
  $("lang").textContent = t.toggle;
  $("info").textContent = isOnline() ? t.info3 : vsBot() ? t.info1 : t.info2;
  $("joinCode").placeholder = t.codePh;
  $("onlinePanel").hidden = !isOnline();
  $("lobby").hidden = !!net.room; $("inRoom").hidden = !net.room;
  if (net.room) {
    $("roomLine").textContent = t.roomLine(net.room, net.color === 1 ? t.blackWord : t.whiteWord, net.status);
    $("peerDot").classList.toggle("on", peerOn());
    $("shareLink").textContent = shareUrl();
  }
  $("undo").hidden = isOnline();
  document.querySelectorAll("#modeSeg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  document.querySelectorAll("#diffSeg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.diff === diff));
  $("diffSeg").hidden = !vsBot();
  for (const i of [1, 2]) {
    const inp = $("name" + i);
    if (document.activeElement !== inp) inp.value = isOnline() || (vsBot() && i === 2) ? name(i) : (names[i] || defaultName(i));
    inp.readOnly = !nameEditable(i);
    inp.setAttribute("aria-label", t.nameLabel(defaultName(i)));
  }
  update();
  if ($("overlay").classList.contains("show")) showWin();
}

// 玩家 1 永远执黑、玩家 2 永远执白；谁先手由 first 决定（输家下局先手）
function newGame() {
  clearTimeout(botTimer); botTimer = null;
  board = Array.from({ length: N }, () => Array(N).fill(0));
  moves = []; winner = 0; winLine = null; hover = null;
  current = first;
  $("overlay").classList.remove("show");
  update(); draw();
  maybeBot();
}

// ---------- 绘制 ----------
let size, cell, pad;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  size = rect.width; cell = size / N; pad = cell / 2;
  draw();
}

function pos(i) { return pad + i * cell; }

function draw() {
  if (!size) return;
  ctx.clearRect(0, 0, size, size);
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--grid");
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < N; i++) {
    ctx.moveTo(pos(0), pos(i)); ctx.lineTo(pos(N - 1), pos(i));
    ctx.moveTo(pos(i), pos(0)); ctx.lineTo(pos(i), pos(N - 1));
  }
  ctx.stroke();
  ctx.lineWidth = 2;
  ctx.strokeRect(pos(0), pos(0), pos(N - 1) - pos(0), pos(N - 1) - pos(0));
  ctx.fillStyle = ctx.strokeStyle;
  for (const [x, y] of [[3, 3], [11, 3], [7, 7], [3, 11], [11, 11]]) {
    ctx.beginPath(); ctx.arc(pos(x), pos(y), cell * 0.1, 0, Math.PI * 2); ctx.fill();
  }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (board[y][x]) stone(x, y, board[y][x], 1);
  if (hover && canMove() && !board[hover.y][hover.x]) stone(hover.x, hover.y, current, 0.4);
  const last = moves[moves.length - 1];
  if (last && !winLine) {
    ctx.fillStyle = "#d9442b";
    ctx.beginPath(); ctx.arc(pos(last.x), pos(last.y), cell * 0.11, 0, Math.PI * 2); ctx.fill();
  }
  if (winLine) {
    const a = winLine[0], b = winLine[winLine.length - 1];
    ctx.strokeStyle = "#d9442b"; ctx.lineWidth = cell * 0.12; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(pos(a.x), pos(a.y)); ctx.lineTo(pos(b.x), pos(b.y)); ctx.stroke();
  }
}

function stone(x, y, who, alpha) {
  const cx = pos(x), cy = pos(y), r = cell * 0.44;
  ctx.save(); ctx.globalAlpha = alpha;
  if (alpha === 1) { ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = cell * 0.12; ctx.shadowOffsetY = cell * 0.06; }
  const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r);
  if (who === 1) { g.addColorStop(0, "#6a6a6a"); g.addColorStop(1, "#0d0d0d"); }
  else { g.addColorStop(0, "#ffffff"); g.addColorStop(1, "#cfc9bf"); }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------- 规则 ----------
const DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];
function checkWin(x, y, who) {
  for (const [dx, dy] of DIRS) {
    const line = [{ x, y }];
    for (const s of [1, -1]) {
      let nx = x + dx * s, ny = y + dy * s;
      while (nx >= 0 && ny >= 0 && nx < N && ny < N && board[ny][nx] === who) {
        s === 1 ? line.push({ x: nx, y: ny }) : line.unshift({ x: nx, y: ny });
        nx += dx * s; ny += dy * s;
      }
    }
    if (line.length >= 5) return line;
  }
  return null;
}

function play(x, y) {
  if (winner || board[y][x]) return;
  board[y][x] = current;
  moves.push({ x, y, who: current });
  const line = checkWin(x, y, current);
  if (line) {
    winner = current; winLine = line;
    scores[winner]++; save(scoresKey(), scores);
    first = winner === 1 ? 2 : 1;
    setTimeout(showWin, 450);
  } else if (moves.length === N * N) {
    winner = -1; setTimeout(showWin, 300);
  } else {
    current = current === 1 ? 2 : 1;
  }
  update(); draw();
  maybeBot();
}

function undo() {
  if (isOnline() || winner || botTurn()) return;
  if (vsBot()) {
    if (!moves.some((m) => m.who === 1)) return;
    while (moves.length && moves[moves.length - 1].who === 2) { const m = moves.pop(); board[m.y][m.x] = 0; }
    const m = moves.pop(); board[m.y][m.x] = 0; current = 1;
  } else {
    if (!moves.length) return;
    const m = moves.pop(); board[m.y][m.x] = 0; current = m.who;
  }
  update(); draw();
}

// ---------- 电脑 ----------
// 以落子点为中心取 9 格（越界算对方），按棋型打分
const PATTERNS = [
  [1e7, ["XXXXX"]],
  [1e5, ["_XXXX_"]],
  [1e4, ["XXXX_", "_XXXX", "XX_XX", "X_XXX", "XXX_X"]],
  [5e3, ["_XXX_", "_XX_X_", "_X_XX_"]],
  [500, ["XXX__", "__XXX", "XX_X_", "_X_XX", "X_XX_", "_XX_X", "XX__X", "X__XX", "X_X_X"]],
  [300, ["__XX__", "_XX__", "__XX_", "_X_X_"]],
  [30, ["XX___", "___XX", "_X__X", "X__X_"]],
];
function lineAt(x, y, dx, dy, who) {
  let s = "";
  for (let k = -4; k <= 4; k++) {
    if (k === 0) { s += "X"; continue; }
    const nx = x + dx * k, ny = y + dy * k;
    if (nx < 0 || ny < 0 || nx >= N || ny >= N) s += "O";
    else s += board[ny][nx] === who ? "X" : board[ny][nx] === 0 ? "_" : "O";
  }
  return s;
}
function dirScore(s) {
  for (const [score, pats] of PATTERNS) {
    for (const p of pats) {
      for (let i = s.indexOf(p); i !== -1; i = s.indexOf(p, i + 1)) if (i <= 4 && i + p.length > 4) return score;
    }
  }
  return 1;
}
function pointScore(x, y, who) {
  let sum = 0, fours = 0, threes = 0;
  for (const [dx, dy] of DIRS) {
    const sc = dirScore(lineAt(x, y, dx, dy, who));
    if (sc >= 1e7) return 1e7;
    if (sc >= 1e4) fours++; else if (sc === 5e3) threes++;
    sum += sc;
  }
  if (fours >= 2 || (fours && threes)) sum += 1e5;   // 双四、四三 = 必胜
  else if (threes >= 2) sum += 2e4;                   // 双活三
  return sum;
}
function candidates() {
  const out = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (board[y][x]) continue;
    let near = false;
    for (let dy = -2; dy <= 2 && !near; dy++) for (let dx = -2; dx <= 2; dx++) {
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < N && ny < N && board[ny][nx]) { near = true; break; }
    }
    if (near) out.push({ x, y });
  }
  return out;
}
function rank(me, defW) {
  const opp = me === 1 ? 2 : 1, c = (N - 1) / 2;
  return candidates().map((p) => {
    const a = pointScore(p.x, p.y, me), d = pointScore(p.x, p.y, opp);
    let s = a >= 1e7 ? 1e9 : d >= 1e7 ? 1e8 : a + defW * d;
    s += 5 - (Math.abs(p.x - c) + Math.abs(p.y - c)) * 0.3 + Math.random();
    return { ...p, s };
  }).sort((p, q) => q.s - p.s);
}
function botPick() {
  if (!moves.length) return { x: 7, y: 7 };
  if (diff === "easy") {
    const r = rank(2, 0.6);
    if (r[0].s >= 1e9 && Math.random() < 0.7) return r[0];
    return r[Math.floor(Math.random() * Math.min(4, r.length))];
  }
  if (diff === "medium") return rank(2, 0.9)[0];
  // 困难：取前 10 个候选，再看对手最好的回应
  const top = rank(2, 1.0).slice(0, 10);
  if (top[0].s >= 1e8) return top[0];
  let best = top[0], bestVal = -Infinity;
  for (const p of top) {
    board[p.y][p.x] = 2;
    const reply = rank(1, 1.0)[0];
    board[p.y][p.x] = 0;
    const val = p.s - 0.8 * (reply ? reply.s : 0);
    if (val > bestVal) { bestVal = val; best = p; }
  }
  return best;
}
function botTurn() { return vsBot() && !winner && current === 2; }
function maybeBot() {
  if (!botTurn() || botTimer) return;
  botTimer = setTimeout(() => {
    botTimer = null;
    if (!botTurn()) return;
    const p = botPick();
    play(p.x, p.y);
  }, 380);
}

// ---------- 界面 ----------
function update() {
  if (!moves) return;
  $("score1").textContent = scores[1]; $("score2").textContent = scores[2];
  $("p1").classList.toggle("active", !winner && current === 1);
  $("p2").classList.toggle("active", !winner && current === 2);
  const st = $("status");
  st.classList.toggle("win", winner > 0);
  if (winner > 0) st.textContent = winText();
  else if (winner === -1) st.textContent = t.draw;
  else if (isOnline()) {
    st.textContent = !net.room ? "" : !peerOn() ? t.waitFriend
      : current === net.color ? t.yourTurn(moves.length + 1) : t.theirTurn(name(current), moves.length + 1);
  }
  else if (vsBot()) st.textContent = current === 1 ? t.yourTurn(moves.length + 1) : t.botTurn;
  else st.textContent = t.turn(name(current), moves.length + 1);
  $("undo").disabled = isOnline() || !!winner || botTurn() || (vsBot() ? !moves.some((m) => m.who === 1) : !moves.length);
}

function winText() {
  if (vsBot()) return winner === 1 ? t.youWin : t.botWin;
  if (isOnline() && net.color) return winner === net.color ? t.youWin : t.wins(name(winner));
  return t.wins(name(winner));
}

function showWin() {
  if (winner > 0) {
    $("winStone").className = "stone " + (winner === 1 ? "black" : "white");
    $("winStone").hidden = false;
    $("winText").textContent = winText();
    $("winSub").textContent = isOnline() ? t.winSubOnline(moves.length, scores[1], scores[2], name(first))
      : vsBot() ? t.winSubBot(moves.length, scores[1], scores[2], first === 1)
      : t.winSub(moves.length, scores[1], scores[2], name(first));
  } else {
    $("winStone").hidden = true;
    $("winText").textContent = t.draw;
    $("winSub").textContent = t.drawSub;
  }
  $("overlay").classList.add("show");
}

function cellAt(e) {
  const r = canvas.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left - pad) / cell);
  const y = Math.round((e.clientY - r.top - pad) / cell);
  return x >= 0 && y >= 0 && x < N && y < N ? { x, y } : null;
}

canvas.addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse") return;
  const c = cellAt(e);
  if (c?.x !== hover?.x || c?.y !== hover?.y) { hover = c; draw(); }
});
canvas.addEventListener("pointerleave", () => { hover = null; draw(); });
function canMove() {
  if (winner) return false;
  if (isOnline()) return !!net.room && peerOn() && net.color === current;
  return !botTurn();
}
canvas.addEventListener("click", (e) => {
  if (!canMove()) return;
  const c = cellAt(e); if (!c || board[c.y][c.x]) return;
  const n = moves.length;
  play(c.x, c.y);
  if (isOnline()) send("move", { game: net.game, n, x: c.x, y: c.y });
});

function switchTo(newMode, newDiff) {
  if (mode === "online" && newMode !== "online") leaveRoom(false);
  mode = newMode; diff = newDiff;
  save("gomoku-mode", mode); save("gomoku-diff", diff);
  scores = load(scoresKey(), { 1: 0, 2: 0 });
  first = 1;
  renderChrome(); newGame();
}
document.querySelectorAll("#modeSeg button").forEach((b) => b.onclick = () => { if (b.dataset.mode !== mode) switchTo(b.dataset.mode, diff); });
document.querySelectorAll("#diffSeg button").forEach((b) => b.onclick = () => { if (b.dataset.diff !== diff) switchTo(mode, b.dataset.diff); });
$("lang").onclick = () => { lang = lang === "en" ? "zh" : "en"; save("gomoku-lang", lang); renderChrome(); };
$("undo").onclick = undo;
$("restart").onclick = () => isOnline() ? onlineNew(false) : newGame();
$("again").onclick = () => isOnline() ? onlineNew(false) : newGame();
$("resetScore").onclick = () => {
  if (isOnline()) return onlineNew(true);
  scores = { 1: 0, 2: 0 }; save(scoresKey(), scores); first = 1; newGame();
};
for (const i of [1, 2]) {
  $("name" + i).addEventListener("input", () => {
    if ($("name" + i).readOnly) return;
    const v = $("name" + i).value;
    if (isOnline()) {
      net.myName = isDefaultName(v) ? "" : v.trim(); save("gomoku-online-name", net.myName);
      send("name", { name: net.myName }); update(); return;
    }
    names[i] = isDefaultName(v) ? "" : v.trim(); save("gomoku-names", names); update();
  });
  $("name" + i).addEventListener("blur", renderChrome);
}
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "z") { e.preventDefault(); undo(); }
});
window.addEventListener("resize", resize);

// ---------- 联机 ----------
function loadScript(src) {
  return new Promise((ok, fail) => { const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = fail; document.head.appendChild(el); });
}
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function newCode() { let c = ""; for (let i = 0; i < 6; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return c; }
function shareUrl() { return location.origin + location.pathname + "#room-" + net.room; }
function showErr(msg) { $("onlineErr").textContent = msg || ""; $("onlineErr").hidden = !msg; }
function publish(event, payload) {
  if (net.client && net.client.connected && net.room)
    net.client.publish(topicFor(net.room), JSON.stringify({ from: net.id, color: net.color, event, payload }), { qos: 1 });
}
function send(event, payload) { if (peerOn()) publish(event, payload); }
function setStatus(st) { net.status = st; renderChrome(); draw(); }

function snapshot() { return { game: net.game, moves: moves.map((m) => [m.x, m.y]), first, scores, name: net.myName }; }
const sendState = () => send("state", snapshot());

// 用对方的完整局面替换本地局面
function adopt(st) {
  net.game = st.game; scores = st.scores || { 1: 0, 2: 0 };
  board = Array.from({ length: N }, () => Array(N).fill(0));
  moves = []; winner = 0; winLine = null; current = st.first;
  $("overlay").classList.remove("show");
  for (const [x, y] of st.moves) {
    board[y][x] = current; moves.push({ x, y, who: current });
    const line = checkWin(x, y, current);
    if (line) { winner = current; winLine = line; break; }
    if (moves.length === N * N) { winner = -1; break; }
    current = 3 - current;
  }
  first = winner > 0 ? (winner === 1 ? 2 : 1) : st.first;
  if (winner) showWin();
  save(scoresKey(), scores);
  update(); draw();
}

function onMessage({ event, payload: p }) {
  if (event === "state") {
    if (p.name !== undefined) net.peerName = p.name;
    if (p.game > net.game || (p.game === net.game && p.moves.length > moves.length)) adopt(p);
    else if (p.game < net.game || p.moves.length < moves.length) sendState();
    renderChrome();
  } else if (event === "want-state") sendState();
  else if (event === "name") { net.peerName = p.name; renderChrome(); }
  else if (event === "move") {
    if (p.game === net.game && p.n === moves.length && !winner && !board[p.y][p.x]) play(p.x, p.y);
    else send("want-state", {});
  } else if (event === "new") {
    if (p.game <= net.game) return;
    net.game = p.game; first = p.first; scores = p.scores;
    save(scoresKey(), scores); newGame();
  }
}

// 每个客户端订阅房间 topic；消息带上自己的 id 和颜色，只处理对方颜色发来的消息
function onPacket(raw) {
  let m; try { m = JSON.parse(raw); } catch { return; }
  if (!m || m.from === net.id || !net.room) return;
  if (m.color === net.color) return;
  if (m.event === "bye") {
    if (m.from === net.peerId) { net.peerId = null; setStatus("wait"); }
    return;
  }
  const isNew = net.peerId !== m.from || !peerOn();
  net.peerId = m.from; net.lastSeen = Date.now();
  if (isNew) { showErr(""); setStatus("on"); sendState(); }
  if (m.event === "hello") return;
  if (m.event === "ping") return;
  onMessage(m);
}

function connectBroker(code, urls) {
  const url = urls[0];
  const c = mqtt.connect(url, {
    clientId: "gmk_" + net.id, connectTimeout: 8000, reconnectPeriod: 3000, clean: true,
    will: { topic: topicFor(code), payload: JSON.stringify({ from: net.id, color: net.color, event: "bye" }), qos: 0, retain: false },
  });
  net.client = c;
  let everConnected = false;
  c.on("connect", () => {
    if (net.client !== c) return;
    everConnected = true; showErr("");
    c.subscribe(topicFor(code), { qos: 1 }, () => { publish("hello", {}); });
    if (net.status === "find") setStatus("wait");
  });
  c.on("message", (_topic, buf) => { if (net.client === c) onPacket(buf.toString()); });
  c.on("error", () => {});
  c.on("offline", () => {
    if (net.client !== c) return;
    if (!everConnected && urls.length > 1) { c.end(true); connectBroker(code, urls.slice(1)); return; }
    showErr(t.connectErr);
  });
}

async function joinRoom(code, creating) {
  showErr("");
  code = code.toUpperCase();
  leaveRoom(false);
  net.room = code; net.game = 0; net.id = Math.random().toString(36).slice(2, 12);
  let saved = null; try { saved = sessionStorage.getItem("gomoku-room-" + code); } catch {}
  net.color = creating || saved === "1" ? 1 : 2;
  try { sessionStorage.setItem("gomoku-room-" + code, String(net.color)); } catch {}
  history.replaceState(null, "", "#room-" + code);
  scores = load(scoresKey(), { 1: 0, 2: 0 }); first = 1;
  newGame();
  setStatus("find");
  try { if (!window.mqtt) await loadScript(MQTT_JS); } catch { showErr(t.connectErr); return; }
  if (net.room !== code) return;
  connectBroker(code, BROKERS);
  // 心跳：每 5 秒报一次在线，15 秒没消息就当对方离开
  net.beat = setInterval(() => {
    publish("ping", {});
    if (peerOn() && Date.now() - net.lastSeen > 15000) { net.peerId = null; setStatus("wait"); }
  }, 5000);
}

function onlineNew(resetScores) {
  if (!net.room) return;
  if (resetScores) { scores = { 1: 0, 2: 0 }; first = 1; }
  net.game++;
  newGame();
  save(scoresKey(), scores);
  send("new", { game: net.game, first, scores });
}

function leaveRoom(render = true) {
  clearInterval(net.beat);
  if (net.client) { publish("bye", {}); const c = net.client; setTimeout(() => c.end(true), 200); }
  Object.assign(net, { room: null, color: 0, client: null, peerId: null, beat: null, status: "", peerName: "", game: 0 });
  if (location.hash) history.replaceState(null, "", location.pathname);
  showErr("");
  if (render) { first = 1; scores = { 1: 0, 2: 0 }; newGame(); renderChrome(); }
}

$("createRoom").onclick = () => joinRoom(newCode(), true);
$("joinRoom").onclick = () => {
  const c = $("joinCode").value.trim().toUpperCase();
  if (!/^[A-Z0-9]{6}$/.test(c)) return showErr(t.badCode);
  joinRoom(c, false);
};
$("joinCode").addEventListener("keydown", (e) => { if (e.key === "Enter") $("joinRoom").click(); });
$("leaveRoom").onclick = () => leaveRoom();
$("copyLink").onclick = async () => {
  try {
    await navigator.clipboard.writeText(shareUrl());
    $("copyLink").textContent = t.copied; setTimeout(() => ($("copyLink").textContent = t.copy), 1500);
  } catch {
    const range = document.createRange(); range.selectNodeContents($("shareLink"));
    getSelection().removeAllRanges(); getSelection().addRange(range);
  }
};

window.addEventListener("pagehide", () => publish("bye", {}));
window.addEventListener("hashchange", () => {
  const m = location.hash.match(/^#room-([A-Za-z0-9]{6})$/);
  if (m && m[1].toUpperCase() !== net.room) {
    if (mode !== "online") { mode = "online"; save("gomoku-mode", mode); }
    joinRoom(m[1], false);
  }
});

newGame();
const hashRoom = location.hash.match(/^#room-([A-Za-z0-9]{6})$/);
if (hashRoom) { mode = "online"; save("gomoku-mode", mode); }
else if (mode === "online") { /* 没有房间号就停在大厅 */ }
renderChrome();
resize();
if (hashRoom) joinRoom(hashRoom[1], false);
</script>
